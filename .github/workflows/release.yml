name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches both manifest versions
        run: |
          cd plugins/jobkit
          test "v$(jq -r .version plugin.json)" = "$GITHUB_REF_NAME"
          test "v$(jq -r .version .claude-plugin/plugin.json)" = "$GITHUB_REF_NAME"
      - name: Build the Claude upload archive
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/jobkit-claude.zip" "$GITHUB_REF_NAME:plugins/jobkit"
          cd "$RUNNER_TEMP"
          sha256sum jobkit-claude.zip > jobkit-claude.zip.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/jobkit-claude.zip" "$RUNNER_TEMP/jobkit-claude.zip.sha256" --generate-notes
